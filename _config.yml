#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: Tyler Green

description: Personalized software mentorship in Rust and Python for quietly ambitious developers, plus essays on neurodivergence, meaningful work, and rebuilding life beyond the defaults.
jobTitle: Founder & Technical Mentor

# URL of your avatar or profile pic (you could use your GitHub profile pic)
avatar: https://avatars.githubusercontent.com/u/15916062

url: "https://tyleragreen.com"
personalGithubUrl: "https://github.com/JonesBeach"
linkedInUrl: "https://www.linkedin.com/in/tylergreen/"

codeUrl: "https://fromscratchcode.com"
memphisUrl: "https://fromscratchcode.com/memphis/"

pressUrl: "https://fromscratchpress.com"
permalink: /:title/

# The release of Jekyll Now that you're using
version: v1.2.0

# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: 'highlight'

# Set the Sass partials directory, as we're using @imports
sass:
  style: :expanded # You might prefer to minify using :compressed

# Use the following plug-ins
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem

# Ensure we get the pages in the _history collection in the sitemap
defaults:
  - scope:
      path: "history"
    values:
      sitemap: true

# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - build_history_pages.sh

collections:
  history:
    output: true
    permalink: /history/:path/
