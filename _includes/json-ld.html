  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "name": "{{ site.name }}",
        "url": "{{ site.url }}",
        "sameAs": [
          "{{ site.codeUrl }}",
          "{{ site.memphisUrl }}",
          "{{ site.personalGithubUrl }}",
          "{{ site.linkedInUrl }}"
        ],
        "jobTitle": "{{ site.jobTitle }}",
        "worksFor": {
          "@type": "Organization",
          "name": "From Scratch Code",
          "url": "{{ site.codeUrl }}",
          "logo": {
            "@type": "ImageObject",
            "url": "{{ site.codeUrl }}/favicon-512x512.png"
          }
        },
        "description": "{{ site.description }}",
        "knowsAbout": [
          "Rust",
          "Python",
          "Software Mentorship",
          "Web Development",
          "Writing"
        ],
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "{{ site.url }}"
        }
      {% if page.layout == 'post' %}
      },
      {
        "@type": "Article",
        "headline": "{{ page.title }}",
        "description": "{{ page.excerpt | strip_html }}",
        "author": {
          "@type": "Person",
          "name": "{{ site.name }}",
          "url": "{{ site.url }}"
        },
        "datePublished": "{{ page.date | date_to_xmlschema }}",
        "dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "{{ site.url }}{{ page.url }}"
        }
      {% endif %}
      }
    ]
  }
  </script>
